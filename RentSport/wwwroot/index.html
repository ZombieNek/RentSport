<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RentSpot — Аренда спортивного инвентаря</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <!-- шапка -->
    <header class="header">
        <div class="container header__container">
            <!-- Логотип -->
            <a href="index.html" class="logo">Rent<span>Spot</span></a>

            <!-- Поиск -->
            <div class="search-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="10" cy="10" r="7" />
                    <line x1="21" y1="21" x2="15" y2="15" />
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию или локации...">
            </div>

            <!-- Кнопки в шапке -->
            <div class="header-actions">
                <a href="messages.html" class="icon-btn" aria-label="Сообщения">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                </a>
                <a href="profile.html" class="icon-btn" aria-label="Профиль">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </a>
                <button id="themeToggle" class="icon-btn" aria-label="Тема">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- тело -->
    <main class="main">
        <div class="container">

            <!-- категории -->
            <section class="categories-section">
                <div class="categories-header">
                    <h2 class="section-title">Категории</h2>
                    <button id="resetFiltersBtn" class="reset-link">Сбросить всё</button>
                </div>
                <div class="categories-wrapper">
                    <div class="categories" id="categoriesContainer"></div>
                </div>
            </section>

            <!-- сортировка -->
            <div class="sort-bar">
                <div class="sort-buttons">
                    <span class="sort-label">Сортировка:</span>
                    <button class="sort-btn" data-sort="default">📅 По дате</button>
                    <button class="sort-btn" data-sort="price-asc">💰 По цене ↑</button>
                    <button class="sort-btn" data-sort="price-desc">💰 По цене ↓</button>
                    <button class="sort-btn" data-sort="title-asc">📝 А-Я</button>
                    <button class="sort-btn" data-sort="title-desc">📝 Я-А</button>
                </div>
                <div class="results-count" id="resultsCount"></div>
            </div>

            <!-- сетка объявлений -->
            <div class="ads-grid" id="adsGrid">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Загрузка объявлений...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- плавающая кнопка -->
    <a href="profile.html" class="fab" id="fabButton">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
    </a>

    <!-- футер -->
    <footer class="footer">
        <div class="container footer__container">
            <p>© 2026 RentSpot — Аренда спортивного инвентаря</p>
            <div class="footer-links">
                <a href="#">О проекте</a>
                <a href="#">Контакты</a>
            </div>
        </div>
    </footer>

    <script src="js/index.js"></script>
</body>
</html>
