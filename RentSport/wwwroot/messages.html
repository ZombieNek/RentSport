<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RentSpot — Сообщения</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/messages.css">
</head>
<body>

    <!-- шапка -->
    <header class="header">
        <div class="container header__container">
            <!-- Логотип -->
            <a href="index.html" class="logo">Rent<span>Spot</span></a>

            <!-- Кнопки в шапке -->
            <div class="header-actions">
                <a href="profile.html" class="icon-btn" aria-label="Профиль">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </a>
                <button id="themeToggle" class="icon-btn" aria-label="Тема">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- тело -->
    <main class="main messages-main">
        <div class="messages-container">

            <!-- список чатов -->
            <div class="chats-panel">
                <div class="chats-header">
                    <h2>Сообщения</h2>
                </div>
                <div class="chats-search">
                    <input type="text" id="chatsSearch" placeholder="Поиск по чатам..." class="chats-search-input">
                </div>
                <div id="chatsList" class="chats-list">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- переписка -->
            <div class="chat-panel" id="chatPanel">

                <div class="empty-chat-state" id="emptyChatState">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <p>Выберите чат, чтобы начать общение</p>
                </div>

                <div id="activeChat" style="display: none;">
                    <div class="chat-header" id="chatHeader">
                        <button id="backToChatsBtn" class="back-to-chats-btn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="19" y1="12" x2="5" y2="12" />
                                <polyline points="12 19 5 12 12 5" />
                            </svg>
                        </button>
                        <img id="chatAvatar" class="chat-avatar" src="" alt="">
                        <div class="chat-header-info">
                            <h3 id="chatName"></h3>
                            <p id="chatAdTitle"></p>
                        </div>
                    </div>

                    <div id="chatMessages" class="chat-messages-area">
                        <!-- Сообщения через js -->
                    </div>

                    <!-- Форма отправки сообщения -->
                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <textarea id="messageInput" class="chat-input-message" placeholder="Напишите сообщение..." rows="1" maxlength="500"></textarea>
                            <button id="sendMessageBtn" class="send-btn" disabled>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13" />
                                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- удаление чатов -->
    <div id="contextMenu" class="context-menu" style="display: none;">
        <div class="context-menu-item" id="deleteChatContextBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                <line x1="10" y1="11" x2="10" y2="17" />
                <line x1="14" y1="11" x2="14" y2="17" />
            </svg>
            Удалить чат
        </div>
    </div>

    <script src="js/messages.js"></script>
</body>
</html>
